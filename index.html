<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✨ Daily Horoscope</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lato:wght@300;400&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0d0d2b;color:#e8d5b7;font-family:'Lato',sans-serif;min-height:100vh;padding:20px}
  h1{font-family:'Cinzel',serif;text-align:center;font-size:clamp(1.6rem,5vw,2.8rem);color:#f5c842;letter-spacing:2px;margin-bottom:6px}
  #date{text-align:center;color:#a89ec9;font-size:.95rem;margin-bottom:30px;letter-spacing:1px}
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px;max-width:900px;margin:0 auto}
  .card{background:rgba(255,255,255,.05);border:1px solid rgba(245,200,66,.15);border-radius:16px;padding:22px 12px;text-align:center;cursor:pointer;transition:transform .2s,box-shadow .2s,background .2s}
  .card:hover{transform:translateY(-4px);box-shadow:0 0 18px rgba(245,200,66,.35);background:rgba(245,200,66,.08)}
  .card .emoji{font-size:2rem;display:block;margin-bottom:8px}
  .card .sign{font-family:'Cinzel',serif;font-size:.9rem;color:#f5c842;letter-spacing:1px}
  .card .dates{font-size:.72rem;color:#8880a8;margin-top:4px}
  #detail{display:none;max-width:680px;margin:0 auto;animation:fadeIn .4s ease}
  @keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  #detail-sign{font-family:'Cinzel',serif;font-size:clamp(1.4rem,4vw,2rem);color:#f5c842;text-align:center;margin-bottom:6px}
  #detail-dates{text-align:center;color:#8880a8;font-size:.85rem;margin-bottom:24px}
  #detail-emoji{font-size:3rem;display:block;text-align:center;margin-bottom:16px}
  #detail-text{background:rgba(255,255,255,.05);border:1px solid rgba(245,200,66,.15);border-radius:16px;padding:28px;line-height:1.85;font-size:1.05rem;color:#e8d5b7}
  #detail-text-th{margin-top:10px;background:rgba(255,255,255,.03);border:1px solid rgba(168,158,201,.2);border-radius:16px;padding:22px 28px;line-height:2;font-size:.97rem;color:#c8bde0;font-style:italic}
  #lucky-color{margin-top:16px;background:rgba(255,255,255,.05);border:1px solid rgba(245,200,66,.15);border-radius:16px;padding:18px 28px;display:flex;align-items:center;gap:14px}
  #lucky-color-swatch{width:36px;height:36px;border-radius:50%;flex-shrink:0;box-shadow:0 0 12px rgba(255,255,255,.3)}
  #lucky-color-label{font-family:'Cinzel',serif;color:#a89ec9;font-size:.8rem;letter-spacing:1px;margin-bottom:3px}
  #lucky-color-name{color:#f5c842;font-size:1rem;font-weight:400}
  #back{display:block;margin:24px auto 0;background:transparent;border:1px solid rgba(245,200,66,.5);color:#f5c842;font-family:'Cinzel',serif;font-size:.9rem;padding:10px 28px;border-radius:30px;cursor:pointer;letter-spacing:1px;transition:background .2s,box-shadow .2s}
  #back:hover{background:rgba(245,200,66,.12);box-shadow:0 0 14px rgba(245,200,66,.3)}
  footer{text-align:center;color:#3d3860;font-size:.78rem;margin-top:40px}
</style>
</head>
<body>

<h1>✨ Daily Horoscope 🌙</h1>
<p id="date"></p>

<div id="grid"></div>

<div id="detail">
  <span id="detail-emoji"></span>
  <div id="detail-sign"></div>
  <div id="detail-dates"></div>
  <p id="detail-text"></p>
  <p id="detail-text-th"></p>
  <div id="lucky-color">
    <div id="lucky-color-swatch"></div>
    <div>
      <div id="lucky-color-label">สีโชคดีประจำวัน</div>
      <div id="lucky-color-name"></div>
    </div>
  </div>
  <button id="back">⬅ Back to the Stars</button>
</div>

<footer>⭐ Written in the stars, just for you ⭐</footer>

  {name:"Aries",emoji:"♈",dates:"Mar 21 – Apr 19",horoscope:"The cosmos are lighting a bonfire beneath your feet, dear Aries. Today, your boldness is a superpower — stride into that conversation you've been avoiding, because the universe has already RSVP'd yes on your behalf. A flash of inspiration around midday could spark something you'll still be talking about in six months. Trust the fire in your chest; it knows the way. 🔥",horoscopeTh:"จักรวาลกำลังจุดประกายไฟอยู่ใต้เท้าของคุณ ราศีเมษที่รัก ความกล้าหาญของคุณคือพลังพิเศษในวันนี้ — ก้าวเข้าไปในบทสนทนาที่คุณหลีกเลี่ยงมาตลอด เพราะจักรวาลได้ตอบรับแทนคุณไปแล้ว แรงบันดาลใจที่จะปรากฏขึ้นในช่วงเที่ยงวันอาจจุดประกายสิ่งที่คุณยังพูดถึงอยู่อีกหกเดือนข้างหน้า เชื่อมั่นในไฟที่ลุกโชนอยู่ในหัวใจ มันรู้จักทางดีที่สุด 🔥",lucky:{name:"แดงสด (Crimson Red)",hex:"#e63946"}},
  {name:"Taurus",emoji:"♉",dates:"Apr 20 – May 20",horoscope:"Slow and luscious, like honey dripping from a golden spoon — that's the energy you're swimming in today, sweet Taurus. The stars are urging you to savour rather than rush. A small, quiet pleasure — a perfect cup of tea, sunlight through a window — holds a secret message if you pause long enough to receive it. Your patience today is a kind of magic. 🌿",horoscopeTh:"ช้าและหวาน เหมือนน้ำผึ้งหยดจากช้อนทอง — นั่นคือพลังงานที่คุณกำลังล่องลอยอยู่ในวันนี้ ราศีพฤษภที่หวาน ดวงดาวกำลังกระตุ้นให้คุณลิ้มรสมากกว่าจะรีบเร่ง ความสุขเล็กน้อยที่เงียบสงบ — ชาร้อนที่สมบูรณ์แบบ แสงแดดผ่านหน้าต่าง — ซ่อนข้อความลับไว้หากคุณหยุดนานพอที่จะรับมัน ความอดทนของคุณในวันนี้คือเวทมนตร์ชนิดหนึ่ง 🌿",lucky:{name:"เขียวมรกต (Emerald Green)",hex:"#2d9b6f"}},
  {name:"Gemini",emoji:"♊",dates:"May 21 – Jun 20",horoscope:"Your mind is a disco ball today, Gemini, scattering brilliant light in every direction. Two ideas that seemed completely unrelated are about to collide and become something magnificent. Say yes to the unexpected invitation. The conversation you stumble into by accident will be the one you remember. Both of your inner selves are finally agreeing — don't waste this rare alliance. 💫",horoscopeTh:"จิตใจของคุณคือลูกบอลดิสโก้ในวันนี้ ราศีเมถุน กระจายแสงสว่างสดใสออกไปทุกทิศทาง ความคิดสองอย่างที่ดูไม่เกี่ยวข้องกันกำลังจะชนกันและกลายเป็นสิ่งมหัศจรรย์ ตอบรับคำเชิญที่ไม่คาดฝัน บทสนทนาที่คุณสะดุดเจอโดยบังเอิญจะเป็นบทที่คุณจดจำ ตัวตนทั้งสองด้านของคุณเห็นพ้องกันในที่สุด — อย่าปล่อยให้พันธมิตรอันหายากนี้สูญเปล่า 💫",lucky:{name:"เหลืองทอง (Golden Yellow)",hex:"#f5c842"}},
  {name:"Cancer",emoji:"♋",dates:"Jun 21 – Jul 22",horoscope:"The moon is cradling you today like the most beloved secret it's ever kept, dear Cancer. Your intuition is running on rocket fuel — if something feels off, it is; if something feels right, lean all the way in. A memory surfaces not to haunt you but to show you how far you've traveled. Share a little softness with someone who looks like they need it; you have plenty to spare. 🌊",horoscopeTh:"ดวงจันทร์กำลังโอบกอดคุณในวันนี้ เหมือนความลับอันล้ำค่าที่สุดที่มันเคยเก็บรักษา ราศีกรกฏที่รัก สัญชาตญาณของคุณกำลังวิ่งด้วยพลังจรวด — ถ้ารู้สึกว่าบางอย่างผิดพลาด มันก็ผิดจริง ถ้ารู้สึกถูกต้อง ก็โน้มตัวเข้าไปเต็มที่ ความทรงจำผุดขึ้นมาไม่ใช่เพื่อหลอกหลอน แต่เพื่อแสดงให้เห็นว่าคุณมาได้ไกลแค่ไหน แบ่งปันความอ่อนโยนให้กับคนที่ดูเหมือนต้องการมัน คุณมีเหลือเฟือ 🌊",lucky:{name:"เงิน (Silver)",hex:"#c0c0d8"}},
  {name:"Leo",emoji:"♌",dates:"Jul 23 – Aug 22",horoscope:"The spotlight didn't find you today, Leo — you *are* the spotlight. Every room you walk into rearranges itself around your gravity, and people can't quite explain why they feel warmer in your presence. A creative project is begging you to be a little more audacious than feels comfortable. Comfortable is for naps. The stars say: make it bigger, make it bolder, make it *you*. 👑",horoscopeTh:"แสงสปอตไลต์ไม่ได้มาหาคุณในวันนี้ ราศีสิงห์ — คุณ *คือ* แสงสปอตไลต์ ทุกห้องที่คุณก้าวเข้าไปจะจัดระเบียบตัวเองรอบแรงดึงดูดของคุณ และผู้คนอธิบายไม่ได้ว่าทำไมถึงรู้สึกอบอุ่นขึ้นเมื่ออยู่ใกล้คุณ โครงการสร้างสรรค์กำลังขอร้องให้คุณกล้าหาญมากกว่าที่รู้สึกสบาย ความสบายนั้นไว้สำหรับงีบหลับ ดวงดาวบอกว่า: ทำให้ใหญ่กว่า กล้ากว่า และเป็น *ตัวคุณ* มากกว่านี้ 👑",lucky:{name:"ส้มทอง (Amber Orange)",hex:"#ff8c00"}},
  {name:"Virgo",emoji:"♍",dates:"Aug 23 – Sep 22",horoscope:"You've noticed something no one else has, Virgo — you always do. Today that sharp, luminous attention of yours is your greatest gift to the world. A system, plan, or relationship that's been slightly crooked is finally ready to be gently straightened. Don't apologise for caring about the details; the details are where the poetry lives. And yes, you can afford to rest this evening. The list will still be there. 📋",horoscopeTh:"คุณสังเกตเห็นบางอย่างที่คนอื่นไม่เห็น ราศีกันย์ — คุณทำแบบนั้นเสมอ ความสนใจที่คมชัดและเปล่งประกายของคุณในวันนี้คือของขวัญที่ยิ่งใหญ่ที่สุดที่คุณมีให้กับโลก ระบบ แผนการ หรือความสัมพันธ์ที่คดเคี้ยวเล็กน้อยพร้อมที่จะถูกปรับตรงแล้ว อย่าขอโทษที่ใส่ใจรายละเอียด รายละเอียดคือที่ซึ่งบทกวีอาศัยอยู่ และใช่ คุณสามารถพักผ่อนในตอนเย็นได้ รายการจะยังอยู่ที่นั่น 📋",lucky:{name:"ครีม (Cream White)",hex:"#f5f0e1"}},
  {name:"Libra",emoji:"♎",dates:"Sep 23 – Oct 22",horoscope:"Beauty is your native language today, Libra, and the universe is handing you a particularly eloquent paragraph. An aesthetic choice — in your home, your outfit, your words — lands with unexpected power. The balance you've been carefully tending tips in your favour, almost effortlessly. Lean into partnership; two perspectives today are genuinely better than one. Say the gracious thing. You'll mean every word. ⚖️",horoscopeTh:"ความงามคือภาษาแม่ของคุณในวันนี้ ราศีตุล และจักรวาลกำลังมอบย่อหน้าที่พูดจาไพเราะเป็นพิเศษให้คุณ การเลือกด้านสุนทรียะ — ในบ้าน เครื่องแต่งกาย หรือคำพูดของคุณ — ส่งผลด้วยพลังที่ไม่คาดคิด ความสมดุลที่คุณดูแลอย่างระมัดระวังกำลังเอียงมาข้างคุณอย่างแทบไม่ต้องออกแรง พิงเข้าหาหุ้นส่วน มุมมองสองด้านในวันนี้ดีกว่าหนึ่งเดียวจริงๆ พูดในสิ่งที่สง่างาม คุณจะหมายความตามนั้นทุกคำ ⚖️",lucky:{name:"ชมพูโรส (Rose Pink)",hex:"#e8a0bf"}},
  {name:"Scorpio",emoji:"♏",dates:"Oct 23 – Nov 21",horoscope:"You've been sitting with a truth that most people would flinch away from, Scorpio, and today the universe commends your courage. Something hidden is about to surface — not to undo you, but to set you free. Your intensity is not too much; it is precisely enough for what today requires. A connection deepens past small talk into the kind of honesty that changes people. You are the transformation. 🦋",horoscopeTh:"คุณกำลังนั่งอยู่กับความจริงที่คนส่วนใหญ่จะหดหนี ราศีพิจิก และจักรวาลในวันนี้ชื่นชมความกล้าของคุณ บางอย่างที่ซ่อนเร้นกำลังจะผุดขึ้นมา — ไม่ใช่เพื่อทำลายคุณ แต่เพื่อปลดปล่อยคุณ ความเข้มข้นของคุณไม่ใช่เรื่องมากเกินไป มันพอดีกับสิ่งที่วันนี้ต้องการพอดี การเชื่อมต่อที่ลึกซึ้งกว่าการพูดคุยเล็กน้อยสู่ความซื่อสัตย์ที่เปลี่ยนแปลงผู้คน คุณคือการเปลี่ยนแปลงนั้น 🦋",lucky:{name:"แดงเลือดนก (Deep Burgundy)",hex:"#800020"}},
  {name:"Sagittarius",emoji:"♐",dates:"Nov 22 – Dec 21",horoscope:"Your inner compass is pointing somewhere wild and wonderful today, Sagittarius, and the only wrong answer is to ignore it. An idea arrives from a completely unexpected direction — a stranger's offhand remark, a page you randomly open. Philosophy and adventure are merging; let them. Someone needs to hear the unconventional wisdom rattling around in your head. Say it out loud. The arrow always flies truest when you trust the aim. 🏹",horoscopeTh:"เข็มทิศภายในของคุณกำลังชี้ไปยังที่แห่งหนึ่งที่สุดขีดและมหัศจรรย์ในวันนี้ ราศีธนู และคำตอบที่ผิดเดียวคือการเพิกเฉยมัน ความคิดมาถึงจากทิศทางที่ไม่คาดคิดอย่างสิ้นเชิง — คำพูดเผินๆ ของคนแปลกหน้า หน้าหนังสือที่คุณเปิดแบบสุ่ม ปรัชญาและการผจญภัยกำลังรวมกัน ปล่อยให้มันเป็นไป ใครบางคนต้องการได้ยินปัญญาแบบนอกกรอบที่วนอยู่ในหัวของคุณ พูดออกมาดังๆ ลูกศรบินตรงที่สุดเสมอเมื่อคุณเชื่อมั่นในการเล็ง 🏹",lucky:{name:"ม่วงมณี (Royal Purple)",hex:"#7b2d8b"}},
  {name:"Capricorn",emoji:"♑",dates:"Dec 22 – Jan 19",horoscope:"The mountain you've been climbing has a better view than you expected, Capricorn. Today you catch a glimpse of the summit, and it looks remarkably like something you once scribbled in a notebook and thought too ambitious. Keep going. A small but meaningful recognition comes your way — accept it without deflecting. You've earned it. Tonight, let yourself be proud, just quietly, in the way only you know how. 🏔️",horoscopeTh:"ภูเขาที่คุณกำลังปีนมีวิวที่ดีกว่าที่คุณคาดไว้ ราศีมังกร วันนี้คุณเห็นยอดเขาชั่วครู่ และมันดูคล้ายกับสิ่งที่คุณเคยขีดเขียนในสมุดบันทึกและคิดว่าทะเยอทะยานเกินไปอย่างน่าแปลกใจ ก้าวต่อไป การยอมรับเล็กน้อยแต่มีความหมายกำลังมาถึงคุณ — รับมันโดยไม่ต้องหันเหออก คุณสมควรได้รับมัน คืนนี้ ปล่อยให้ตัวเองรู้สึกภาคภูมิใจ เงียบๆ ในแบบที่คุณรู้จักดีที่สุด 🏔️",lucky:{name:"น้ำตาลดิน (Earthy Brown)",hex:"#8b5e3c"}},
  {name:"Aquarius",emoji:"♒",dates:"Jan 20 – Feb 18",horoscope:"The future is leaning down and whispering in your ear today, Aquarius, and only you can hear it. An idea that seems eccentric now will be obvious to everyone else in about three years — start anyway. Your community needs your particular shade of strange, so stop dimming it out of politeness. An unexpected ally appears, someone who gets it without needing a diagram. The revolution, as always, begins in your imagination. ⚡",horoscopeTh:"อนาคตกำลังโน้มตัวลงมากระซิบที่หูของคุณในวันนี้ ราศีกุมภ์ และมีเพียงคุณที่ได้ยิน ความคิดที่ดูแปลกประหลาดในตอนนี้จะชัดเจนสำหรับทุกคนในอีกสามปี — เริ่มเลย ชุมชนของคุณต้องการความแปลกในแบบของคุณโดยเฉพาะ ดังนั้นหยุดทำให้มันหรี่ลงเพื่อความสุภาพ พันธมิตรที่ไม่คาดคิดปรากฏตัว คนที่เข้าใจโดยไม่ต้องการแผนผัง การปฏิวัติ เช่นเคย เริ่มต้นในจินตนาการของคุณ ⚡",lucky:{name:"ฟ้าไฟฟ้า (Electric Blue)",hex:"#00bfff"}},
  {name:"Pisces",emoji:"♓",dates:"Feb 19 – Mar 20",horoscope:"You are swimming in the in-between today, Pisces — that luminous space where dreams and waking life blur at the edges. Pay attention to what arrives there; it carries messages your logical mind would edit out. Your empathy is oceanic right now, so choose wisely who you offer it to, and leave a little for yourself. A creative act, however small, becomes a kind of prayer today. The universe is listening with both ears. 🐟",horoscopeTh:"คุณกำลังว่ายอยู่ในระหว่างทางในวันนี้ ราศีมีน — พื้นที่เรืองแสงนั้นที่ความฝันและชีวิตตื่นเบลอรวมกันที่ขอบ ใส่ใจกับสิ่งที่มาถึงที่นั่น มันบรรจุข้อความที่จิตใจเชิงตรรกะของคุณจะแก้ไขออก ความเห็นอกเห็นใจของคุณกว้างใหญ่เหมือนมหาสมุทรตอนนี้ ดังนั้นเลือกอย่างฉลาดว่าจะมอบให้ใคร และเหลือไว้สักหน่อยสำหรับตัวเอง การกระทำสร้างสรรค์ เล็กน้อยแค่ไหนก็ตาม กลายเป็นคำอธิษฐานชนิดหนึ่งในวันนี้ จักรวาลกำลังฟังด้วยหูทั้งสองข้าง 🐟",lucky:{name:"เขียวทะเล (Sea Green)",hex:"#3cb371"}}
];

const detail = document.getElementById('detail');

document.getElementById('date').textContent = new Date().toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});

signs.forEach((s,i)=>{
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<span class="emoji">${s.emoji}</span><div class="sign">${s.name}</div><div class="dates">${s.dates}</div>`;
  card.addEventListener('click',()=>{
    grid.style.display = 'none';
    detail.style.display = 'block';
    document.getElementById('detail-emoji').textContent = s.emoji;
    document.getElementById('detail-sign').textContent = s.name;
    document.getElementById('detail-dates').textContent = s.dates;
    document.getElementById('detail-text').textContent = s.horoscope;
    document.getElementById('detail-text-th').textContent = s.horoscopeTh;
    document.getElementById('lucky-color-swatch').style.background = s.lucky.hex;
    document.getElementById('lucky-color-name').textContent = s.lucky.name;
    window.scrollTo({top:0,behavior:'smooth'});
  });
  grid.appendChild(card);
});

document.getElementById('back').addEventListener('click',()=>{
  detail.style.display = 'none';
  grid.style.display = 'grid';
  window.scrollTo({top:0,behavior:'smooth'});
});
</script>
</body>
</html>
